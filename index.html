<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nobles Ziania | Elite Medical Academy</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Playfair Display', 'serif'],
              editorial: ['Cormorant Garamond', 'serif'],
            },
            colors: {
              'noble-gold': '#D4AF37', /* More metallic gold */
              'noble-gold-light': '#F3E5AB',
              'noble-black': '#0A0A0A',
              'noble-charcoal': '#1C1C1C',
              'noble-gray': '#F9FAFB',
              'glass-border': 'rgba(255, 255, 255, 0.2)',
              'glass-highlight': 'rgba(255, 255, 255, 0.1)',
            },
            backgroundImage: {
              'gold-gradient': 'linear-gradient(135deg, #D4AF37 0%, #C5A059 100%)',
              'gold-text': 'linear-gradient(to right, #D4AF37, #F3E5AB, #D4AF37)',
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.03)',
              'glass-hover': '0 20px 40px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01)',
              'gold-glow': '0 0 30px rgba(212, 175, 55, 0.15)',
            },
            animation: {
              'float-slow': 'float 12s ease-in-out infinite',
              'float-medium': 'float 8s ease-in-out infinite',
              'float-fast': 'float 5s ease-in-out infinite',
              'drift-1': 'drift 40s linear infinite',
              'drift-2': 'drift 50s linear infinite reverse',
              'drift-3': 'drift 60s linear infinite',
              'shimmer': 'shimmer 2.5s infinite linear',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-15px)' },
              },
              drift: {
                '0%': { transform: 'translate(0, 0) rotate(0deg)' },
                '100%': { transform: 'translate(40px, 20px) rotate(5deg)' },
                '50%': { transform: 'translate(20px, 40px) rotate(-5deg)' }
              },
              shimmer: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(100%)' }
              }
            }
          }
        }
      }
    </script>

    <style>
      body {
        background-color: #F8F9FA;
        color: #0A0A0A;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      .dark body {
        background-color: #0A0A0A;
        color: #F9FAFB;
      }

      /* Noise Texture Overlay - Reduced opacity for cleaner look */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.02;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      .dark .bg-noise {
        opacity: 0.03; /* Slightly more visible on dark */
      }

      /* Premium Glass Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 
          0 10px 40px -10px rgba(0,0,0,0.05),
          inset 0 1px 0 rgba(255,255,255,0.8);
      }
      
      .dark .glass-panel {
        background: rgba(20, 20, 20, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 10px 40px -10px rgba(0,0,0,0.5),
          inset 0 1px 0 rgba(255,255,255,0.05);
      }
      
      .glass-panel-heavy {
        background: linear-gradient(180deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0.4) 100%);
        backdrop-filter: blur(40px) saturate(120%);
        -webkit-backdrop-filter: blur(40px) saturate(120%);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 
          0 20px 50px -12px rgba(0,0,0,0.1),
          inset 0 1px 1px rgba(255,255,255,1);
      }

      .dark .glass-panel-heavy {
        background: linear-gradient(180deg, rgba(30,30,30,0.8) 0%, rgba(10,10,10,0.6) 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 
          0 20px 60px -12px rgba(0,0,0,0.6),
          inset 0 1px 0 rgba(255,255,255,0.05);
      }
      
      .dark-glass-panel {
        background: rgba(15, 15, 15, 0.7);
        backdrop-filter: blur(30px) saturate(120%);
        -webkit-backdrop-filter: blur(30px) saturate(120%);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 
          0 20px 60px -12px rgba(0,0,0,0.5),
          inset 0 1px 0 rgba(255,255,255,0.05);
      }

      .text-balance {
        text-wrap: balance;
      }

      .text-gradient-gold {
        background: linear-gradient(to right, #B8860B, #D4AF37, #B8860B);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
        background-size: 200% auto;
        animation: shimmer 5s linear infinite reverse;
      }

      /* Smooth Scrolling */
      html {
        scroll-behavior: smooth;
      }
      
      /* Selection Color */
      ::selection {
        background: rgba(212, 175, 55, 0.2);
        color: #0A0A0A;
      }
      .dark ::selection {
        background: rgba(212, 175, 55, 0.3);
        color: #F9FAFB;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
